<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FXPro Master Compact Portal</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0e17;
            --bg-card: #111827;
            --border-color: #374151;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .portal-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .logo-area {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }
        .logo-area span {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .info-box {
            background-color: #0a0e17;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 30px;
            text-align: left;
            font-size: 13px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .info-row:last-child { margin-bottom: 0; }
        .info-label { color: var(--text-muted); }
        .info-value { font-family: 'JetBrains Mono', monospace; font-weight: 500; }
        .repo-link {
            color: var(--accent-blue);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .repo-link:hover { color: #60a5fa; text-decoration: underline; }
        .btn-enter {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-blue), #2563eb);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            font-size: 15px;
            letter-spacing: 0.5px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }
        .btn-enter:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="logo-area">FXPro <span>Master Compact</span></div>
        <div class="subtitle">Automatizált Kereskedési Riportrendszer</div>
        
        <div class="info-box">
            <div class="info-row">
                <span class="info-label">Rendszer Státusz:</span>
                <span class="info-value" style="color: var(--accent-green);">ONLINE</span>
            </div>
            <div class="info-row">
                <span class="info-label">Követett termékek:</span>
                <span class="info-value" style="color: #ffffff;">254 Instrumentum</span>
            </div>
            <div class="info-row">
                <span class="info-label">Index frissítve (Helyi):</span>
                <span class="info-value">2026-10-21 19:47:08</span>
            </div>
            <div class="info-row">
                <span class="info-label">GitHub Repository:</span>
                <span class="info-value">
                    <a class="repo-link" href="https://github.com" target="_blank">pgtradermt5/fxpro-riport</a>
                </span>
            </div>
        </div>

        <a href="fxpro_teljes_piaci_riport.html" class="btn-enter">Belépés a Teljes Piaci Riporthoz</a>
    </div>
</body>
</html>
