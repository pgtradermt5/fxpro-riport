<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FXPro Master Compact Portal</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0e17;
            --bg-card: #111827;
            --border-color: #374151;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: '-apple-system', 'SF Pro Text', 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top));
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            padding-left: calc(20px + env(safe-area-inset-left));
            padding-right: calc(20px + env(safe-area-inset-right));
        }
        .portal-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transition: border-color 0.3s ease;
        }
        .portal-card:hover {
            border-color: #4b5563;
        }
        .logo-area {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo-area span.gradient-text {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .device-badge {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
            vertical-align: middle;
            transition: all 0.3s ease;
        }
        .device-badge.mode-mobile {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .device-badge.mode-pc {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-gold);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.4;
        }
        .info-box {
            background-color: #0a0e17;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 28px;
            text-align: left;
            font-size: 13px;
        }
        .info-row {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .info-row:last-child { margin-bottom: 0; }
        .info-label { color: var(--text-muted); flex-shrink: 0; }
        .info-value { 
            font-family: 'JetBrains Mono', monospace; 
            font-weight: 500; 
            text-align: right;
            word-break: break-all;
        }
        .repo-link {
            color: var(--accent-blue);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .repo-link:hover { color: #60a5fa; text-decoration: underline; }
        .btn-enter {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-blue), #2563eb);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            font-size: 15px;
            letter-spacing: 0.5px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }
        .btn-enter:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-top: calc(12px + env(safe-area-inset-top));
                padding-bottom: calc(12px + env(safe-area-inset-bottom));
                padding-left: calc(12px + env(safe-area-inset-left));
                padding-right: calc(12px + env(safe-area-inset-right));
            }
            .portal-card {
                padding: 28px 18px;
            }
            .logo-area {
                font-size: 21px;
            }
            .info-box {
                padding: 14px;
            }
            .info-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                margin-bottom: 14px;
            }
            .info-value {
                text-align: left;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="logo-area">
            FXPro <span class="gradient-text" id="dynamic-title-part">Master Portal</span>
            <span id="dynamic-badge" class="device-badge">Detektálás...</span>
        </div>
        <div class="subtitle" id="dynamic-subtitle">Automatizált Kereskedési Rendszer</div>
        
        <div class="info-box">
            <div class="info-row">
                <span class="info-label">Rendszer Státusz:</span>
                <span class="info-value" style="color: var(--accent-green);">ONLINE</span>
            </div>
            <div class="info-row">
                <span class="info-label">Követett termékek:</span>
                <span class="info-value" style="color: #ffffff;">254 Instrumentum</span>
            </div>
            <div class="info-row">
                <span class="info-label">Index frissítve (Helyi):</span>
                <span class="info-value">2026-10-22 22:34:22</span>
            </div>
            <div class="info-row">
                <span class="info-label">GitHub Repository:</span>
                <span class="info-value">
                    <a class="repo-link" href="https://github.com" target="_blank">pgtradermt5/fxpro-riport</a>
                </span>
            </div>
        </div>

        <!-- 🚀 JAVÍTVA: A hivatkozás most már pontosan a fxpro_teljes_piaci_riport.html fájlra mutat -->
        <a href="fxpro_teljes_piaci_riport.html" class="btn-enter" id="dynamic-btn-text">Belépés a Teljes Piaci Riporthoz</a>
    </div>

    <script>
        function adjustPortalForDevice() {
            const titlePart = document.getElementById('dynamic-title-part');
            const badge = document.getElementById('dynamic-badge');
            const subtitle = document.getElementById('dynamic-subtitle');
            const btnText = document.getElementById('dynamic-btn-text');

            if (window.innerWidth < 768) {
                document.title = "FXPro Master Compact Portal (Mobil)";
                titlePart.textContent = "Master Compact";
                badge.textContent = "mobil";
                badge.className = "device-badge mode-mobile";
                subtitle.textContent = "Automatizált Kereskedési Riportrendszer";
                btnText.textContent = "Belépés a Mobil Riporthoz";
            } else {
                document.title = "FXPro Master Analytics Portal (Asztali)";
                titlePart.textContent = "Analytics Portal";
                badge.textContent = "monitor";
                badge.className = "device-badge mode-pc";
                subtitle.textContent = "Intézményi Szintű Statisztikai Vezérlőpult";
                btnText.textContent = "Megnyitás Nagy Képernyőn";
            }
        }
        window.addEventListener('load', adjustPortalForDevice);
        window.addEventListener('resize', adjustPortalForDevice);
    </script>
</body>
</html>
