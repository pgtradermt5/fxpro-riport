        .mode-btn { background-color: var(--primary); color: white; border: none; padding: 15px 25px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 8px; width: 80%; transition: background-color 0.2s; }

        .result-box { display: none; text-align: center; }
        .score-text { font-size: 2.5rem; font-weight: bold; color: var(--primary); margin: 20px 0; }
        .percentage { font-size: 1.5rem; margin-bottom: 30px; }
        .restart-btn { background-color: var(--primary); color: white; border: none; padding: 15px 35px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; }

let questions = [];
let currentQuestionIndex = 0;
let score = 0;
let testLength = 50;
let currentMode = 'random50';

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function renderThemeList() {
    const listContainer = document.getElementById("theme-list");
    listContainer.innerHTML = "";
    let total = 0;
    
    themeStats.forEach(item => {
        total += item.count;
        const row = document.createElement("div");
        row.className = "theme-item";
        row.innerHTML = `<span>${item.name}</span><span class="theme-count">${item.count} kérdés</span>`;
        listContainer.appendChild(row);
    });
    
    const totalRow = document.createElement("div");
    totalRow.className = "theme-item";
    totalRow.style.fontWeight = "bold";
    totalRow.style.borderTop = "2px solid #dee2e6";
    totalRow.style.marginTop = "10px";
    totalRow.style.paddingTop = "10px";
    totalRow.innerHTML = `<span>Összesen beolvasva:</span><span class="theme-count">${total} kérdés</span>`;
    listContainer.appendChild(totalRow);
}

function showStartScreen() {
    document.getElementById("start-section").style.display = "block";
    document.getElementById("quiz-section").style.display = "none";
    document.getElementById("result-section").style.display = "none";
    document.getElementById("main-title").innerText = "Komplex Biztonságtechnikai és Informatikai Teszt";
    renderThemeList();
}

function selectMode(mode) {
    currentMode = mode;
    startQuiz();
}
function startQuiz() {
    let allQuestionsCopy = JSON.parse(JSON.stringify(originalQuestions));
    
    if (currentMode === 'tricky') {
        questions = allQuestionsCopy.filter(q => q.isTricky === true);
        shuffle(questions);
        testLength = questions.length;
    } else {
        shuffle(allQuestionsCopy);
        if (currentMode === 'random50') {
            testLength = Math.min(50, allQuestionsCopy.length);
            questions = allQuestionsCopy.slice(0, testLength);
        } else {
            testLength = allQuestionsCopy.length;
            questions = allQuestionsCopy;
        }
    }
    
    questions.forEach(q => {
        let correctAnsText = q.a[q.correct];
        shuffle(q.a);
        q.correct = q.a.indexOf(correctAnsText);
    });

    currentQuestionIndex = 0;
    score = 0;
    
    document.getElementById("start-section").style.display = "none";
    document.getElementById("quiz-section").style.display = "block";
    document.getElementById("result-section").style.display = "none";
    
    showQuestion();
}

function showQuestion() {
    const currentQuestion = questions[currentQuestionIndex];
    const percent = (currentQuestionIndex / testLength) * 100;
    document.getElementById("progress").style.width = percent + "%";
    
    if (currentMode === 'tricky') {
        document.getElementById("question-number").innerText = "🔥 TRÜKKÖS MÓD: " + (currentQuestionIndex + 1) + " / " + testLength + " kérdés";
    } else {
        document.getElementById("question-number").innerText = (currentQuestionIndex + 1) + " / " + testLength + " kérdés";
    }
    
    document.getElementById("question-text").innerText = currentQuestion.q;
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";
    
    currentQuestion.a.forEach((option, index) => {
        const button = document.createElement("button");
        button.className = "option-btn";
        button.innerText = option;
        button.onclick = () => checkAnswer(button, index);
        optionsContainer.appendChild(button);
    });
    document.getElementById("next-button").style.display = "none";
}

function checkAnswer(clickedButton, selectedIndex) {
    const currentQuestion = questions[currentQuestionIndex];
    const allButtons = document.querySelectorAll(".option-btn");
    allButtons.forEach(btn => btn.disabled = true);
    
    if (selectedIndex === currentQuestion.correct) {
        clickedButton.classList.add("correct");
        score++;
    } else {
        clickedButton.classList.add("wrong");
        allButtons[currentQuestion.correct].classList.add("correct");
    }
    document.getElementById("next-button").style.display = "block";
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < testLength) {
        showQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById("quiz-section").style.display = "none";
    document.getElementById("result-section").style.display = "block";
    document.getElementById("main-title").innerText = "Eredményjelző";
    
    document.getElementById("score").innerText = score + " / " + testLength;
    const finalPercent = Math.round((score / testLength) * 100);
    document.getElementById("percent").innerText = finalPercent + "%";
}

window.onload = showStartScreen;
