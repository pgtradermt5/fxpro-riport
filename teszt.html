<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktív Tanuló Teszt</title>
    <style>
        :root { --primary: #2b5c8f; --primary-hover: #1e436d; --bg: #f4f7f6; --card-bg: #ffffff; --text: #333333; --success: #28a745; --danger: #dc3545; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 800px; width: 100%; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); text-align: center; margin-bottom: 30px; }
        .progress-bar { background-color: #e9ecef; border-radius: 8px; overflow: hidden; margin-bottom: 25px; }
        .progress { height: 10px; background-color: var(--primary); width: 0%; transition: width 0.3s ease; }
        .quiz-box { display: block; }
        .question-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; }
        .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .option-btn { background-color: #f8f9fa; border: 2px solid #dee2e6; padding: 14px 20px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 1rem; transition: all 0.2s ease; }
        .option-btn:hover:not([disabled]) { background-color: #e9ecef; border-color: #adb5bd; }
        .option-btn.correct { background-color: #d4edda !important; border-color: var(--success) !important; color: #155724; font-weight: bold; }
        .option-btn.wrong { background-color: #f8d7da !important; border-color: var(--danger) !important; color: #721c24; }
        .next-btn { display: none; background-color: #ffc107; color: #212529; border: none; padding: 12px 25px; font-size: 1rem; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; text-align: center; transition: background-color 0.2s; }
        .next-btn:hover { background-color: #e0a800; }
        .result-box { display: none; text-align: center; }
        .score-text { font-size: 2.5rem; font-weight: bold; color: var(--primary); margin: 20px 0; }
        .percentage { font-size: 1.5rem; margin-bottom: 30px; }
        .restart-btn { background-color: var(--primary); color: white; border: none; padding: 15px 35px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; }
        .restart-btn:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>
<div class="container">
    <h1 id="main-title">Munkavédelmi és Informatikai Teszt</h1>
    <div id="quiz-section" class="quiz-box">
        <div class="progress-bar"><div id="progress" class="progress"></div></div>
        <div id="question-number" style="font-weight: bold; margin-bottom: 5px; color: #666;"></div>
        <div id="question-text" class="question-text"></div>
        <div id="options-container" class="options"></div>
        <button id="next-button" class="next-btn" onclick="nextQuestion()">Következő kérdés ➔</button>
    </div>
    <div id="result-section" class="result-box">
        <h2>A teszt véget ért!</h2>
        <p>Az Ön elért eredménye az 50 kérdésből:</p>
        <div id="score" class="score-text">0 / 50</div>
        <div id="percent" class="percentage">0%</div>
        <button class="restart-btn" onclick="startQuiz()">Újra (Újabb 50 véletlen kérdés)</button>
    </div>
</div>

    { q: "Mit kell igazolnia a munkavállalónak az aláírásával az egyéni védőeszközök kapcsán?", a: ["Az eszköz átvételét, valamint a használatának oktatását, gyakorlását", "A munkaszerződés felbontását", "A napi ledolgozott munkaóráit"], correct: 0 },
    { q: "Szabad-e egyéni védőeszközt írásbeli engedély nélkül elvinni a munkahelyről?", a: ["Nem, szigorúan tilos elvinni", "Igen, a dolgozó saját tulajdonává válik", "Csak hétvégén megengedett"], correct: 0 },
    { q: "Melyik kategóriájú védőeszköznél vélelmezi a gyártó, hogy a felhasználó maga is képes megítélni a védelmi szintet?", a: ["1. kategória (kis védelmi szintű, egyszerű eszközök)", "3. kategória (komplex tervezésű eszközök)", "2. kategória"], correct: 0 },
    { q: "Hány fokos felületi hőmérsékletig tartozik a tárgyak kezelése az 1. kategóriájú védőeszközök alá?", a: ["Az 50°C-t nem meghaladó tárgyakig", "A 100°C feletti tárgyakig", "Pontosan 0°C alatti tárgyakig"], correct: 0 },
    { q: "Melyik eszköz tartozik egyértelműen a 2. kategóriájú védőeszközök közé?", a: ["Minden védősisak (sportsisak is), arcvédők, szemvédők és hallásvédők", "A papírmaszkok és a kertészkesztyűk", "A búvárkészülékek és a tűzoltósisakok"], correct: 0 },
    { q: "Milyen környezeti levegő-hőmérséklet felett számít egy eszköz a 3. kategóriába (hőhatás elleni védelem)?", a: ["Amely eléri vagy meghaladja a 100°C-ot", "Amely eléri a 40°C-ot", "Pontosan 50°C-os hőmérsékletnél"], correct: 0 },
    { q: "A munkavédelmi szabályok szerint mekkora feszültség számít már veszélyesnek váltakozó áram esetén?", a: ["Az 50 V és az ezt meghaladó értékek", "A 12 V feletti értékek", "Csak a 230 V feletti hálózati feszültség"], correct: 0 },
    { q: "Melyik nyelv NEM szerepel példaként a számítógépek által ismert kódnyelvek (programnyelvek) között?", a: ["HTML/CSS", "BASIC, LOGO", "Java, Pascal"], correct: 0 }
];

let questions = []; let currentQuestionIndex = 0; let score = 0; const TEST_LENGTH = 50;
function shuffle(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } return array; }

function startQuiz() {
    let allQuestionsCopy = JSON.parse(JSON.stringify(originalQuestions)); shuffle(allQuestionsCopy); questions = allQuestionsCopy.slice(0, TEST_LENGTH);
    questions.forEach(q => { let correctAnsText = q.a[q.correct]; shuffle(q.a); q.correct = q.a.indexOf(correctAnsText); });
    currentQuestionIndex = 0; score = 0; document.getElementById("quiz-section").style.display = "block"; document.getElementById("result-section").style.display = "none"; document.getElementById("main-title").innerText = "Munkavédelmi és Informatikai Teszt"; showQuestion();
}

function showQuestion() {
    const currentQuestion = questions[currentQuestionIndex]; const percent = (currentQuestionIndex / TEST_LENGTH) * 100; document.getElementById("progress").style.width = percent + "%";
    document.getElementById("question-number").innerText = (currentQuestionIndex + 1) + " / " + TEST_LENGTH + " kérdés"; document.getElementById("question-text").innerText = currentQuestion.q;
    const optionsContainer = document.getElementById("options-container"); optionsContainer.innerHTML = "";
    
    currentQuestion.a.forEach((option, index) => {
        const button = document.createElement("button"); button.className = "option-btn"; button.innerText = option;
        button.onclick = () => checkAnswer(button, index); optionsContainer.appendChild(button);
    });
    document.getElementById("next-button").style.display = "none";
}

function checkAnswer(clickedButton, selectedIndex) {
    const currentQuestion = questions[currentQuestionIndex]; const allButtons = document.querySelectorAll(".option-btn");
    allButtons.forEach(btn => btn.disabled = true);
    if (selectedIndex === currentQuestion.correct) { clickedButton.classList.add("correct"); score++; } else { clickedButton.classList.add("wrong"); allButtons[currentQuestion.correct].classList.add("correct"); }
    document.getElementById("next-button").style.display = "block";
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < TEST_LENGTH) { showQuestion(); } else { showResults(); }
}

function showResults() {
    document.getElementById("quiz-section").style.display = "none"; document.getElementById("result-section").style.display = "block"; document.getElementById("main-title").innerText = "Eredményjelző";
    document.getElementById("score").innerText = score + " / " + TEST_LENGTH; const finalPercent = Math.round((score / TEST_LENGTH) * 100); document.getElementById("percent").innerText = finalPercent + "%";
}
window.onload = startQuiz;
</script>
