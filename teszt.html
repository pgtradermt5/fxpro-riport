            color: var(--text-color);

            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -1px rgb(0 0 0 / 0.1);
            box-sizing: border-box;
            -webkit-transform: translateZ(0); /* Safari GPU fix */
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            font-size: 1.8rem;
        }

        h2 {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 20px;
        }

        .stats-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .stats-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .menu-btn {
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-align: center;
            -webkit-appearance: none; /* Safari natív gomb fix */
        }

        .menu-btn:active {
            transform: scale(0.98);
        }

        .btn-tricky { background-color: #ea580c; }
        .btn-random { background-color: #0d9488; }
        .btn-all { background-color: #2563eb; }

        .progress-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #64748b;
        }

        .badge {
            background: #e2e8f0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .tricky-badge {
            background: #ffedd5;
            color: #ea580c;
            border: 1px solid #fed7aa;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .answers-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .answer-btn {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            text-align: left;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
            color: var(--text-color);
            font-weight: 500;
            -webkit-appearance: none;
        }

        .answer-btn:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .answer-btn.correct {
            background: #dcfce7 !important;
            border-color: var(--success-color) !important;
            color: #14532d !important;
        }

        .answer-btn.wrong {
            background: #fee2e2 !important;
            border-color: var(--error-color) !important;
            color: #7f1d1d !important;
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .next-btn {
            background: var(--skip-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.05);
            -webkit-appearance: none;
        }

        .next-btn:hover {
            background: var(--skip-hover);
        }

        .next-btn.has-answered {
            background: var(--primary-color);
        }

        .next-btn.has-answered:hover {
            background: var(--primary-hover);
        }

        .result-screen {
            text-align: center;
            padding: 20px 0;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0;
        }

        .restart-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            -webkit-appearance: none;
        }

            background: var(--primary-hover);
        }

</head>

        let aktivaltKerdesek = []; 
        let currentIndex = 0;
        let correctAnswersCount = 0;
        let answeredQuestionsCount = 0;
        let hasSelectedAnswer = false;

        // Safari-biztos Fisher-Yates tömbkeverő algoritmus
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
            return array;
        }

        function renderStats() {
            const container = document.getElementById("stats-content");
            if (!statisztikaAdat || statisztikaAdat.length === 0) {
                container.innerText = "Nincs elérhető statisztikai adat.";
                return;
            }
            
            let htmlBuffer = statisztikaAdat.map(m => `• <strong>${m.name}</strong><br>${m.count} kérdés`).join("<br><br>");
            let osszesen = statisztikaAdat.reduce((sum, item) => sum + item.count, 0);
            
            htmlBuffer += `<br><hr style="border:0; border-top:1px solid #bfdbfe; margin:15px 0;"><strong>Összesen beolvasva:</strong><br>${osszesen} kérdés`;
            container.innerHTML = htmlBuffer;
        }

        function startQuiz(mode) {
            currentIndex = 0;
            correctAnswersCount = 0;
            answeredQuestionsCount = 0;

            if (mode === 'tricky') {
                aktivaltKerdesek = eredetiKerdesBank.filter(q => q.isTricky === true);
            } 
            else if (mode === 'random') {
                let csakNormalKerdesek = eredetiKerdesBank.filter(q => q.isTricky !== true);
                // Safari-stabil keverés alkalmazása a másolaton
                let masolat = JSON.parse(JSON.stringify(csakNormalKerdesek));
                shuffleArray(masolat);
                aktivaltKerdesek = masolat.slice(0, 50);
            } 
            else if (mode === 'all') {
                aktivaltKerdesek = eredetiKerdesBank.filter(q => q.isTricky !== true);
            }

            if (aktivaltKerdesek.length === 0) {
                alert("A választott játékmódhoz nem található kérdés!");
                return;
            }

            document.getElementById("menu-interface").style.display = "none";
            document.getElementById("quiz-interface").style.display = "block";
            document.getElementById("result-interface").style.display = "none";

            loadQuestion(currentIndex);
        }

        function loadQuestion(index) {
            if (index >= aktivaltKerdesek.length) {
                showResults();
                return;
            }

            hasSelectedAnswer = false;
            const qData = aktivaltKerdesek[index];
            
            const nextBtn = document.getElementById("next-button");
            nextBtn.innerText = "Kérdés átugrása ➔";
            nextBtn.classList.remove("has-answered");

            document.getElementById("progress-text").innerText = `Kérdés: ${index + 1} / ${aktivaltKerdesek.length}`;
            
            const badge = document.getElementById("modul-badge");
            if (qData.isTricky) {
                badge.innerText = "🔥 Haladó / Trükkös";
                badge.classList.add("tricky-badge");
            } else {
                badge.innerText = "Normál feladat";
                badge.classList.remove("tricky-badge");
            }

            document.getElementById("question-container").innerText = qData.q;

            const answersContainer = document.getElementById("answers-container");
            answersContainer.innerHTML = "";

            // Gombok létrehozása DocumentFragment-tel a gyorsabb Safari renderelésért
            const fragment = document.createDocumentFragment();
            qData.a.forEach((valaszSzoveg, i) => {
                const btn = document.createElement("button");
                btn.className = "answer-btn";
                btn.innerText = valaszSzoveg;
                btn.onclick = function() { selectAnswer(btn, i, qData.correct); };
                fragment.appendChild(btn);
            });
            answersContainer.appendChild(fragment);
        }

        function selectAnswer(clickedButton, selectedIndex, correctIndex) {
            if (hasSelectedAnswer) return; 
            
            hasSelectedAnswer = true;
            answeredQuestionsCount++;
            
            const buttons = document.querySelectorAll(".answer-btn");
            buttons.forEach((btn) => btn.disabled = true); 

            if (selectedIndex === correctIndex) {
                clickedButton.classList.add("correct");
                correctAnswersCount++;
            } else {
                clickedButton.classList.add("wrong");
                if (buttons[correctIndex]) {
                    buttons[correctIndex].classList.add("correct"); 
                }
            }

            const nextBtn = document.getElementById("next-button");
            nextBtn.innerText = "Következő kérdés ➔";
            nextBtn.classList.add("has-answered");
        }

        function goToNextQuestion() {
            currentIndex++;
            if (currentIndex < aktivaltKerdesek.length) {
                loadQuestion(currentIndex);
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById("quiz-interface").style.display = "none";
            
            const resultDiv = document.getElementById("result-interface");
            resultDiv.style.display = "block";

            document.getElementById("score-text").innerText = `${correctAnswersCount} / ${aktivaltKerdesek.length}`;
            
            const percentage = aktivaltKerdesek.length > 0 ? Math.round((correctAnswersCount / aktivaltKerdesek.length) * 100) : 0;
            document.getElementById("percentage-text").innerText = `Eredmény: ${percentage}% (Ebből megválaszolva: ${answeredQuestionsCount} db)`;
        }

        function showMainMenu() {
            document.getElementById("menu-interface").style.display = "block";
            document.getElementById("quiz-interface").style.display = "none";
            document.getElementById("result-interface").style.display = "none";
            renderStats();
        }

        window.onload = function() {
            renderStats();
        };
    </script>
